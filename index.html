<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chocolate Day ❤️</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #3b1c10, #8b4513, #d2691e);
      color: #fff;
      overflow: hidden;
      height: 100vh;
      position: relative;
    }

    /* Main container */
    .container {
      text-align: center;
      padding: 60px 20px;
      position: relative;
      z-index: 10;
      animation: fadeInUp 2s ease;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3.8em;
      margin-bottom: 20px;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 15px #ffcc99, 0 0 25px #ff9966; }
      to { text-shadow: 0 0 30px #ff9966, 0 0 60px #ff6633; }
    }

    .shayari {
      font-size: 1.2em;
      line-height: 1.8;
      margin: 20px auto;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
      animation: fadeIn 3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(80px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Button */
    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      font-size: 1em;
      background: linear-gradient(45deg, #ff9966, #ff5e62);
      color: #fff;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      animation: fadeInUp 4s ease;
    }

    .btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px #ff9966;
    }

    /* Floating chocolates */
    .floating-chocolate {
      position: absolute;
      width: 55px;
      height: 55px;
      background: url('img.png') no-repeat center/contain;
      animation: float 10s linear infinite, spin 6s linear infinite, glowChoco 2s ease-in-out infinite alternate;
      opacity: 0.9;
      filter: drop-shadow(0 0 10px #ffcc99);
    }

    @keyframes float {
      from { transform: translateY(100vh) rotate(0deg); }
      to { transform: translateY(-10vh) rotate(360deg); }
    }

    @keyframes glowChoco {
      from { filter: drop-shadow(0 0 5px #ffb347); }
      to { filter: drop-shadow(0 0 20px #ff9966); }
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      color: #ff6699;
      font-size: 20px;
      animation: floatUp 8s linear infinite;
      opacity: 0.8;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* Quotes slider */
    .quotes {
      position: absolute;
      bottom: 80px;
      width: 100%;
      text-align: center;
      font-style: italic;
      font-size: 1.1em;
      opacity: 0.9;
      animation: fadeInUp 3s ease;
    }

    /* Sparkles */
    .sparkle {
      position: absolute;
      width: 5px;
      height: 5px;
      background: white;
      border-radius: 50%;
      opacity: 0.7;
      animation: sparkleAnim 3s linear infinite;
    }

    @keyframes sparkleAnim {
      from { transform: scale(0) translateY(0); opacity: 1; }
      to { transform: scale(1.2) translateY(-100vh); opacity: 0; }
    }

    /* Dudu & Bubu images */
  .couple {
  position: absolute;
  bottom: 130px;  /* ⬅️ Increased from 60px to 130px */
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 30px;
  z-index: 9;
}

    .couple img {
      width: 120px;
      animation: bounce 3s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    footer {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      font-size: 0.9em;
      opacity: 0.8;
    }
  </style>
</head>
<body>
 <audio id="bgMusic" src="song.mp3" autoplay loop hidden></audio>

  <div class="container">
    <h1>Happy Chocolate Day 🍫❤️</h1>
    <div class="shayari">
      <p>
        "Tera naam mere hothon pe aata nahi,<br>
        Par chocolate ki khushboo yaad dila jaati hai... 🍫💞<br>
        Har meethi baat mein tera zikr aata hai,<br>
        Shayad tu hi meri zindagi ki sabse pyaari mithaas hai!" 💖
      </p>
    </div>
    <button class="btn" onclick="sendWish()">Click for a Surprise 💌</button>
  </div>

  <!-- Dudu & Bubu section -->
  <div class="couple">
    <img src="1.png" alt="Dudu">
    <img src="2.png" alt="Bubu">
  </div>

  <div class="quotes" id="quoteBox">💝 "You’re the chocolate that sweetens my life!" 💝</div>

  <footer>Made with ❤️ for my crush Neha</footer>

  <script>
    // Floating chocolates
    for (let i = 0; i < 15; i++) {
      let choco = document.createElement("div");
      choco.classList.add("floating-chocolate");
      choco.style.left = Math.random() * 100 + "vw";
      choco.style.animationDuration = (8 + Math.random() * 5) + "s";
      choco.style.animationDelay = Math.random() * 5 + "s";
      choco.style.width = choco.style.height = (40 + Math.random() * 30) + "px";
      document.body.appendChild(choco);
    }

    // Floating hearts
    const hearts = ['💖','💞','💓','💗','💕','❤️'];
    for (let i = 0; i < 100; i++) {
      let heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
      heart.style.left = Math.random() * 200 + "vw";
      heart.style.animationDuration = (5 + Math.random() * 5) + "s";
      heart.style.fontSize = (16 + Math.random() * 200) + "px";
      document.body.appendChild(heart);
    }

    // Sparkles
    for (let i = 0; i < 40; i++) {
      let spark = document.createElement("div");
      spark.classList.add("sparkle");
      spark.style.left = Math.random() * 100 + "vw";
      spark.style.animationDuration = (3 + Math.random() * 3) + "s";
      document.body.appendChild(spark);
    }

    // Rotating love quotes
    const quotes = [
      "You’re the chocolate that sweetens my life! 🍫",
      "Every chocolate reminds me of your sweetness ❤️",
      "Life is better when you’re with me, just like chocolate! 💞",
      "You're the sugar in my chocolate world 💝",
      "Chocolate melts... but my love for you never will 💋",
      "Tum meri chocolate ho — sabse sweet aur sabse special 💕"
    ];
    let index = 0;
    setInterval(() => {
      document.getElementById("quoteBox").innerText = quotes[index];
      index = (index + 1) % quotes.length;
    }, 4000);

    // Button wish
    function sendWish() {
      alert("You're the sweetest part of my life 🍫💖 Happy Chocolate Day Bayko!");
    }
  </script>
  
<script>
  document.addEventListener("click", () => {
    const music = document.getElementById("bgMusic");
    if (music.paused) {
      music.play().catch(()=>{});
    }
  });
</script>
</body>
</html>
